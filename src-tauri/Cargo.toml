[package]
name = "verkkokyyla"
version = "0.1.0"
description = "verkkokyyla - desktop network debugging tool"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "verkkokyyla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
