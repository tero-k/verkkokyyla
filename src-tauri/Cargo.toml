[package]
name = "verkkokyyla"
version = "0.1.1"
description = "verkkokyyla - desktop network debugging tool"
edition = "2021"
rust-version = "1.89"
default-run = "verkkokyyla"

[lib]
name = "verkkokyyla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
dns-lookup = "2"
hickory-proto = { version = "0.26.1", features = ["dnssec-ring", "serde"] }
hickory-net = { version = "0.26.1", default-features = false, features = ["tokio", "tls-ring", "https-ring", "quic-ring", "h3-ring", "dnssec-ring", "rustls-platform-verifier"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "system-config", "tls-ring", "https-ring", "quic-ring", "h3-ring", "dnssec-ring", "rustls-platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["full", "test-util"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.4"
surge-ping = "0.9"
socket2 = "0.6"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "http2"] }
futures-util = "0.3"
tokio-util = "0.7"
rand = "0.8"
url = "2"
thiserror = "2"
scraper = "0.23"
base64 = "0.22"

[dev-dependencies]
hickory-server = { version = "0.26.1", features = ["tls-ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
if-addrs = "0.13"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
