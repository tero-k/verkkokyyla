[package]
name = "verkkokyyla"
version = "0.3.2"
description = "verkkokyyla - desktop network debugging tool"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/tero-k/verkkokyyla"
authors = ["Tero Kiminki <tero@kiminki.fi>"]
default-run = "verkkokyyla"

[lib]
name = "verkkokyyla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
keyring = "4"
dns-lookup = "4"
hickory-proto = { version = "0.26.1", features = ["dnssec-ring", "serde"] }
hickory-net = { version = "0.26.1", default-features = false, features = ["tokio", "tls-ring", "https-ring", "quic-ring", "h3-ring", "dnssec-ring", "rustls-platform-verifier"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "system-config", "tls-ring", "https-ring", "quic-ring", "h3-ring", "dnssec-ring", "rustls-platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
tokio = { version = "1", features = ["full", "test-util"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4.0"
surge-ping = "0.9"
socket2 = "0.6"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "query", "stream", "gzip", "brotli", "deflate", "http2"] }
futures-util = "0.3"
tokio-util = "0.7"
rand = "0.10"
url = "2"
thiserror = "2"
scraper = "0.29"
semver = "1"
base64 = "0.23"
age = "0.11.5"
bytes = "1"
parking_lot = "0.13"
roxmltree = "0.21"

[dev-dependencies]
hickory-server = { version = "0.26.1", features = ["tls-ring"] }
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
if-addrs = "0.15"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
