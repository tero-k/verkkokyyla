name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    environment: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # macOS Security's PKCS#12 import rejects modern PBES2/AES-256 p12
      # files ("MAC verification failed") while OpenSSL reads them fine.
      # Re-encode to the classic Triple-DES/SHA-1 format `security import`
      # accepts, and export it for the Tauri bundler.
      - name: Re-encode certificate for macOS security import
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert-modern.p12
          # Dump all bags to PEM (no key/cert pairing needed), then rebuild a
          # cleanly-linked legacy p12 from it. Direct p12→p12 re-export fails
          # when the bag localKeyID attributes don't match up.
          openssl pkcs12 -in /tmp/cert-modern.p12 -out /tmp/cert.pem -nodes -passin "pass:$APPLE_CERTIFICATE_PASSWORD"
          grep -q "PRIVATE KEY" /tmp/cert.pem || { echo "certificate has no private key"; exit 1; }
          openssl pkcs12 -export -in /tmp/cert.pem -out /tmp/cert-legacy.p12 \
            -passout "pass:$APPLE_CERTIFICATE_PASSWORD" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          # Mask before publishing to GITHUB_ENV: the re-encoded bytes differ
          # from the stored secret, so GitHub's automatic secret masking does
          # not recognize them and would print the p12 in later env dumps.
          echo "::add-mask::$(base64 -i /tmp/cert-legacy.p12)"
          echo "APPLE_CERTIFICATE=$(base64 -i /tmp/cert-legacy.p12)" >> "$GITHUB_ENV"
          # Same password protects the legacy p12; the secret value itself is
          # already masked by GitHub.
          echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
      # Fail fast (before the 10-minute build) with enough detail to fix
      # signing issues: what the p12 contains and whether macOS accepts the
      # original and re-encoded variants as codesigning identities.
      - name: Diagnose macOS signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "== p12 contents =="
          openssl pkcs12 -in /tmp/cert-modern.p12 -out /tmp/cert.pem -nodes -passin "pass:$APPLE_CERTIFICATE_PASSWORD"
          echo "certificates: $(grep -c 'BEGIN CERTIFICATE' /tmp/cert.pem), private keys: $(grep -c 'PRIVATE KEY' /tmp/cert.pem)"
          openssl crl2pkcs7 -nocrl -certfile /tmp/cert.pem | openssl pkcs7 -print_certs -noout
          echo "== leaf validity =="
          awk '/BEGIN CERTIFICATE/{c++} c==1' /tmp/cert.pem | openssl x509 -noout -subject -dates || true
          for variant in modern legacy; do
            echo "== find-identity ($variant p12) =="
            security create-keychain -p diag-pass "/tmp/diag-$variant.keychain" || true
            security import "/tmp/cert-$variant.p12" -k "/tmp/diag-$variant.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign || true
            security find-identity -v -p codesigning "/tmp/diag-$variant.keychain" || true
            security delete-keychain "/tmp/diag-$variant.keychain" || true
          done
      # tauri-action v1 no longer imports APPLE_CERTIFICATE. Create an
      # ephemeral keychain and authorize codesign without prompting.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/tauri-signing.keychain"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import /tmp/cert-legacy.p12 -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -Eq '[1-9][0-9]* valid identities found'
      # Pull this version's section out of CHANGELOG.md for the release body.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && !/^\[/ { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG section found for $version"
            echo "See CHANGELOG.md for details." > notes.md
          fi
          {
            echo "body<<__NOTES_EOF__"
            cat notes.md
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"
      # Uses the workflow-managed macOS keychain created above.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarization credentials; the signing certificate is
          # already available in the temporary signing keychain.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Verkkokyylä v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
      - name: Remove macOS signing keychain
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/tauri-signing.keychain" || true
          rm -f /tmp/cert-modern.p12 /tmp/cert-legacy.p12 /tmp/cert.pem
      # Tauri has no "portable exe" bundle target; the raw binary is
      # self-contained apart from the WebView2 runtime (preinstalled on
      # up-to-date Windows 10/11). Zip it and attach it to the release.
      - name: Package standalone Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path "src-tauri/target/release/verkkokyyla.exe" -DestinationPath "verkkokyyla_${version}_x64-standalone.zip"
      - name: Attach standalone exe to the release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release upload "${{ github.ref_name }}" "verkkokyyla_${version}_x64-standalone.zip" --clobber
